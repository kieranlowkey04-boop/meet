<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131020">
<title>Peace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✌️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#131020;--panel:#1c1830;--line:#2f2947;--tx:#f4efe8;--mut:#a49fb8;--acc:#c9b8ff;--warm:#ffc9a3;--red:#ff6b7a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(55% 45% at 12% 0,#4a2f6a55,transparent),radial-gradient(50% 45% at 95% 100%,#7a3f4a44,transparent),var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.serif{font-family:Fraunces,Georgia,serif;font-weight:600}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#splash{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:14px;background:radial-gradient(circle at 50% 45%,#2a1f45,var(--bg) 70%);transition:opacity .7s,visibility .7s}
#splash.off{opacity:0;visibility:hidden}
#splash svg{width:140px;height:140px;animation:pulse 2.6s ease-in-out 1.6s infinite}
.dr{fill:none;stroke:url(#gr);stroke-width:4;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1s ease-out forwards}
.dr:nth-child(2){animation-delay:.7s}.dr:nth-child(3){animation-delay:1s}.dr:nth-child(4){animation-delay:1.2s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{transform:scale(1.06);filter:drop-shadow(0 0 18px #c9b8ff88)}}
#splash h2{font-size:34px;letter-spacing:.04em;opacity:0;animation:fade .8s 1.5s forwards}
@keyframes fade{to{opacity:1}}
#sm{color:var(--mut);min-height:1.4em}

#lobby{height:100dvh;overflow:auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;align-items:center;max-width:1120px;margin:auto;padding:28px}
.pv{position:relative;aspect-ratio:4/3;border-radius:28px;overflow:hidden;background:var(--panel);box-shadow:0 30px 80px #0009}
.pv video{width:100%;height:100%;object-fit:cover;display:block}
.pv.mir video{transform:scaleX(-1)}
.pv .ctl{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:12px}
.side{display:grid;gap:14px;max-width:420px}
.side h1{font-size:60px;line-height:1;display:flex;align-items:center;gap:14px}
.side h1 svg{width:54px;height:54px}
.side p{color:var(--mut)}
label{display:grid;gap:6px;color:var(--mut);font-size:13px}
input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:#161227;color:var(--tx);font:inherit;outline:0}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px #c9b8ff33}
.pri{width:100%;padding:14px;border-radius:14px;background:var(--acc);color:#1a1230;font-weight:700;transition:transform .15s}
.pri:hover{transform:translateY(-1px)}
.sec{padding:0 22px;border-radius:14px;background:#2f2947;font-weight:600}
.sec:hover{background:#3c3459}
.or{color:var(--mut);font-size:13px;text-align:center}
#jf{display:flex;gap:8px}
#err{color:var(--red);min-height:1.4em}

#room{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px}
.brand svg{width:28px;height:28px}
.hr{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px}
.pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--tx)}
.pill svg{width:15px;height:15px}
#stage{flex:1;min-height:0;display:flex;gap:12px;padding:0 14px}
#grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--c,1),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:12px}
.tile{position:relative;min-height:0;background:var(--panel);border-radius:22px;overflow:hidden}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.self.mir video{transform:scaleX(-1)}
.tile.share video{object-fit:contain;background:#000}
.tile.big{grid-column:1/-1;grid-row:span 3}
.away .nm::before{content:"💤 "}
.tile.nocam video{visibility:hidden}
.av{display:none;position:absolute;inset:0;place-items:center;font:600 clamp(40px,9vw,88px)/1 Fraunces,Georgia,serif;color:var(--warm);background:radial-gradient(circle,#3a2b58,var(--panel))}
.nocam .av{display:grid}
.nm{position:absolute;left:12px;bottom:12px;padding:4px 12px;border-radius:999px;background:#0008;backdrop-filter:blur(8px);font-size:13px}
.muted .nm::after{content:" 🔇"}
#chat{display:none;flex-direction:column;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}
#chat.open{display:flex}
#chat h3{padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line)}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
#msgs:empty::before{content:"No messages yet. Say hi!";color:var(--mut);margin:auto}
.m{max-width:85%;padding:8px 12px;border-radius:14px;background:#2f2947;align-self:flex-start;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:#4a3f7a}
.m b{display:block;font-size:12px;color:var(--warm);font-weight:600}
.m.me b{color:var(--acc)}
#cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.bar{position:relative;display:flex;justify-content:center;gap:12px;padding:14px}
.rb{position:relative;width:52px;height:52px;border-radius:50%;background:#2f2947;display:grid;place-items:center;transition:background .2s,transform .15s}
.rb:hover{background:#3c3459;transform:translateY(-2px)}
.rb.on{background:var(--acc);color:#1a1230}
.rb.off{background:var(--red);color:#fff}
.rb.off::after{content:"";position:absolute;width:28px;height:2.5px;border-radius:2px;background:#fff;transform:rotate(-45deg)}
.rb:disabled{opacity:.4;cursor:not-allowed}
.rb.end{width:68px;border-radius:26px;background:var(--red);color:#fff}
.rb.end svg{transform:rotate(135deg)}
#bd{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--warm);color:#2a1a10;font-size:12px;font-weight:700;display:grid;place-items:center}
#rp{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px #0008;z-index:15}
#rp button{font-size:26px;width:46px;height:46px;border-radius:50%;transition:transform .15s}
#rp button:hover{transform:scale(1.3)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.fl{position:absolute;bottom:100px;display:grid;justify-items:center;gap:4px;animation:up 3s ease-out forwards}
.fl span{font-size:48px}
.fl small{background:#0009;padding:2px 9px;border-radius:99px;font-size:12px}
@keyframes up{0%{transform:translateY(0) scale(.5);opacity:0}12%{opacity:1;transform:translateY(-24px) scale(1)}100%{transform:translateY(-58vh) rotate(8deg) scale(1.15);opacity:0}}
#tst{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:#3c3459;padding:10px 18px;border-radius:999px;z-index:60;transition:transform .3s;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tst.on{transform:translate(-50%,0)}
@media(max-width:800px){
 #lobby{grid-template-columns:1fr;gap:22px;align-content:start}
 .pv{aspect-ratio:16/11}.side h1{font-size:44px}.side{max-width:none}
 #chat.open{position:fixed;inset:64px 10px 92px;width:auto;z-index:20}
 .hr span{display:none}
}
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
 <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc9a3"/><stop offset="1" stop-color="#c9b8ff"/></linearGradient></defs>
 <symbol id="pc" viewBox="0 0 100 100"><g fill="none" stroke="url(#gr)" stroke-width="6" stroke-linecap="round"><circle cx="50" cy="50" r="42"/><path d="M50 8V92M50 50L20.3 79.7M50 50L79.7 79.7"/></g></symbol>
 <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></symbol>
 <symbol id="i-cam" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/></symbol>
 <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></symbol>
 <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></symbol>
 <symbol id="i-end" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
 <symbol id="i-link" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
 <symbol id="i-flip" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8M3 3v5h5M3 12a9 9 0 0 0 15.5 6.2L21 16M21 21v-5h-5"/></symbol>
 <symbol id="i-share" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
</svg>

<div id="splash">
 <svg viewBox="0 0 100 100" aria-label="Peace"><circle class="dr" cx="50" cy="50" r="42"/><path class="dr" d="M50 8V92"/><path class="dr" d="M50 50L20.3 79.7"/><path class="dr" d="M50 50L79.7 79.7"/></svg>
 <h2 class="serif">Peace</h2><p id="sm"></p>
</div>

<main id="lobby">
 <section class="pv mir">
  <video id="pv" autoplay playsinline muted></video><div class="av" id="pav">?</div>
  <div class="ctl">
   <button class="rb" data-t="mic" aria-label="Toggle microphone (M)"><svg class="i"><use href="#i-mic"/></svg></button>
   <button class="rb" data-t="cam" aria-label="Toggle camera (V)"><svg class="i"><use href="#i-cam"/></svg></button>
   <button class="rb" data-a="flip" hidden aria-label="Flip camera"><svg class="i"><use href="#i-flip"/></svg></button>
  </div>
 </section>
 <section class="side">
  <h1 class="serif"><svg><use href="#pc"/></svg>Peace</h1>
  <p>Free video calls with a meeting code. No sign-up, no downloads.</p>
  <label>Your name<input id="uname" maxlength="24" placeholder="What should we call you?" autocomplete="nickname"></label>
  <button class="pri" id="new">Start a new meeting</button>
  <div class="or">or join with a code</div>
  <form id="jf"><input id="jc" placeholder="abc-defg-hij" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="sec">Join</button></form>
  <div id="err" role="alert"></div>
 </section>
</main>

<main id="room" hidden>
 <header>
  <div class="brand serif"><svg><use href="#pc"/></svg>Peace</div>
  <div class="hr"><span id="cnt"></span><button class="pill" data-a="copy" aria-label="Copy invite link"><svg class="i"><use href="#i-link"/></svg><b id="rc"></b></button></div>
 </header>
 <div id="stage">
  <div id="grid"></div>
  <aside id="chat"><h3>Chat</h3><div id="msgs"></div>
   <form id="cf"><input id="ci" placeholder="Message everyone" autocomplete="off" maxlength="500"><button class="sec">Send</button></form>
  </aside>
 </div>
 <div class="bar">
  <div id="rp" hidden></div>
  <button class="rb" data-t="mic" aria-label="Toggle microphone (M)"><svg class="i"><use href="#i-mic"/></svg></button>
  <button class="rb" data-t="cam" aria-label="Toggle camera (V)"><svg class="i"><use href="#i-cam"/></svg></button>
  <button class="rb" data-a="flip" hidden aria-label="Flip camera"><svg class="i"><use href="#i-flip"/></svg></button>
  <button class="rb" data-a="share" hidden aria-label="Share screen"><svg class="i"><use href="#i-share"/></svg></button>
  <button class="rb" data-a="react" aria-label="Reactions"><svg class="i"><use href="#i-smile"/></svg></button>
  <button class="rb" data-a="chat" aria-label="Chat"><svg class="i"><use href="#i-chat"/></svg><i id="bd" hidden></i></button>
  <button class="rb end" data-a="leave" aria-label="Leave meeting"><svg class="i"><use href="#i-end"/></svg></button>
 </div>
</main>
<div id="fx"></div><div id="tst" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const g=id=>document.getElementById(id);
const EM=['✌️','❤️','😂','👏','🎉','😮','🔥','👍'];
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},
 {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}];
const me={name:'Guest',cam:true,mic:true,has:{},mirror:true,sharing:false,away:false,canFlip:false},peers={},roster={};
let wl;
let stream,peer,code,un=0,tt;
const ini=n=>([...(n||'').trim()][0]||'?').toUpperCase();
const norm=s=>{s=s.trim().toLowerCase();if(s.includes('#'))s=s.split('#').pop();return s.replace(/[^a-z-]/g,'')};
const rid=()=>{const a='abcdefghjkmnpqrstuvwxyz',r=n=>[...Array(n)].map(()=>a[Math.random()*a.length|0]).join('');return r(3)+'-'+r(4)+'-'+r(3)};
const pid=c=>'peace-'+c;
const bcast=d=>Object.values(peers).forEach(p=>p.c&&p.c.open&&p.c.send(d));
const stMsg=()=>({t:'st',cam:me.cam,mic:me.mic,away:me.away,share:me.sharing});

function setSplash(on,m){g('splash').classList.toggle('off',!on);g('sm').textContent=m||''}
function toast(m){const t=g('tst');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

async function getMedia(){
 for(const c of [{video:{facingMode:'user'},audio:true},{audio:true},{video:true}]){
  try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){}
 }
 me.has={cam:!!stream&&stream.getVideoTracks().length>0,mic:!!stream&&stream.getAudioTracks().length>0};
 if(!stream)stream=new MediaStream();
 if(!stream.getVideoTracks().length)stream.addTrack(document.createElement('canvas').captureStream().getVideoTracks()[0]);
 me.cam=me.has.cam;me.mic=me.has.mic;
 try{me.canFlip=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind=='videoinput').length>1}catch(e){}
 me.mirror=(stream.getVideoTracks()[0].getSettings().facingMode||'user')!='environment';
 g('pv').srcObject=stream;sync();
 if(!me.has.cam&&!me.has.mic)g('err').textContent='No camera or mic available. You can still join and watch.';
}
function sync(){
 document.querySelectorAll('[data-t]').forEach(b=>{const k=b.dataset.t;b.classList.toggle('off',!me[k]);b.disabled=!me.has[k]||(k=='cam'&&me.sharing)});
 document.querySelectorAll('[data-a=flip]').forEach(b=>{b.hidden=!me.canFlip||!me.has.cam||me.sharing});
 document.querySelectorAll('[data-a=share]').forEach(b=>b.classList.toggle('on',me.sharing));
 const pv=g('pv').parentNode;pv.classList.toggle('nocam',!me.cam);pv.classList.toggle('mir',me.mirror);
 const s=g('t-me');if(s){s.classList.toggle('nocam',!me.cam);s.classList.toggle('muted',!me.mic);s.classList.toggle('mir',me.mirror);s.classList.toggle('share',me.sharing)}
 layout();
}
function localView(){
 const s=new MediaStream(stream.getTracks()),t=g('t-me');
 [g('pv'),t&&t.querySelector('video')].forEach(v=>v&&(v.srcObject=s));
}
function swap(nt,keep){
 const old=stream.getTracks().find(t=>t.kind==nt.kind);
 if(old){stream.removeTrack(old);if(!keep)old.stop()}
 stream.addTrack(nt);
 Object.values(peers).forEach(p=>p.m&&p.m.peerConnection&&p.m.peerConnection.getSenders().forEach(x=>{if(x.track&&x.track.kind==nt.kind)x.replaceTrack(nt).catch(()=>{})}));
 localView();
}
async function flip(){
 const cur=stream.getVideoTracks()[0],fm=cur.getSettings().facingMode;
 const gum=c=>navigator.mediaDevices.getUserMedia({video:c}).then(s=>s.getVideoTracks()[0]);
 let nt;
 try{
  let c;
  if(fm)c={facingMode:{exact:fm=='user'?'environment':'user'}};
  else{
   const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind=='videoinput'),i=ds.findIndex(d=>d.deviceId==cur.getSettings().deviceId);
   c={deviceId:{exact:ds[(i+1)%ds.length].deviceId}};
  }
  cur.stop();nt=await gum(c);
 }catch(e){
  toast('Couldn’t switch camera');
  try{nt=await gum(fm?{facingMode:fm}:true)}catch(e2){return}
 }
 nt.enabled=me.cam;swap(nt);
 me.mirror=nt.getSettings().facingMode!='environment';sync();
}
async function share(){
 if(me.sharing)return stopShare();
 let st;try{st=(await navigator.mediaDevices.getDisplayMedia({video:true})).getVideoTracks()[0]}catch(e){return}
 me.prev={t:stream.getVideoTracks()[0],cam:me.cam,mirror:me.mirror};
 st.onended=stopShare;swap(st,true);
 me.sharing=true;me.cam=true;me.mirror=false;sync();bcast(stMsg());
}
async function stopShare(){
 if(!me.sharing)return;
 const p=me.prev;me.sharing=false;me.cam=p.cam;me.mirror=p.mirror;
 if(p.t.readyState=='live')swap(p.t);else await regain('video');
 sync();bcast(stMsg());
}
async function regain(k){
 if(!me.has[k=='video'?'cam':'mic']||(k=='video'&&me.sharing))return;
 try{
  const c=k=='video'?{video:{facingMode:me.mirror?'user':'environment'}}:{audio:true};
  const nt=(await navigator.mediaDevices.getUserMedia(c)).getTracks()[0];
  nt.enabled=k=='video'?me.cam:me.mic;swap(nt);
 }catch(e){}
}
async function keepAwake(){try{if(navigator.wakeLock&&!g('room').hidden)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function setAway(){
 me.away=document.hidden&&!me.sharing&&matchMedia('(pointer:coarse)').matches;
 bcast(stMsg());
}
async function revive(){
 if(!peer||g('room').hidden)return;
 keepAwake();
 if(peer.disconnected&&!peer.destroyed)peer.reconnect();
 document.querySelectorAll('.tile video').forEach(v=>v.paused&&v.play().catch(()=>{}));
 await new Promise(r=>setTimeout(r,900));
 for(const k of ['video','audio']){
  const t=stream.getTracks().find(x=>x.kind==k);
  if(!t||t.readyState=='ended'||(t.muted&&!me.sharing))await regain(k);
 }
 Object.keys(roster).forEach(id=>{const p=peers[id];if(!(p&&p.c&&p.c.open))link(id).catch(()=>{})});
}
function tog(k){
 if(!me.has[k]||(me.sharing&&k=='cam'))return;
 const t=(k=='cam'?stream.getVideoTracks():stream.getAudioTracks())[0];
 me[k]=!me[k];t.enabled=me[k];sync();bcast(stMsg());
}

function tile(id){
 const self=id=='me',p=self?me:peers[id];if(!p)return;
 let t=g('t-'+id);
 if(!t){
  t=document.createElement('div');t.id='t-'+id;t.className='tile'+(self?' self':'');
  t.innerHTML='<video autoplay playsinline></video><div class="av"></div><div class="nm"></div>';
  g('grid').append(t);
  if(self){const v=t.querySelector('video');v.muted=true;v.srcObject=stream}
 }
 const n=p.name||'Guest';
 t.querySelector('.av').textContent=ini(n);
 t.querySelector('.nm').textContent=n+(self?' (you)':'');
 t.classList.toggle('nocam',!p.cam||(!self&&!!p.away));t.classList.toggle('muted',!p.mic);t.classList.toggle('away',!self&&!!p.away);t.classList.toggle('share',self?me.sharing:!!p.share);t.classList.toggle('mir',self&&me.mirror);
 layout();
}
function layout(){
 const n=g('grid').children.length,w=innerWidth<800;
 document.querySelectorAll('.tile.big').forEach(t=>t.classList.remove('big'));
 const sh=document.querySelector('.tile.share');if(sh)sh.classList.add('big');
 g('grid').style.setProperty('--c',sh?Math.max(1,Math.min(n-1,w?2:4)):n<2?1:w?(n<3?1:2):n<5?2:n<10?3:4);
 g('cnt').textContent=n+(n>1?' people':' person');
}
addEventListener('resize',layout);
function vid(id,s){
 if(!peers[id])peers[id]={};
 tile(id);const v=g('t-'+id).querySelector('video');if(v.srcObject!==s)v.srcObject=s;
}
function drop(id){
 const p=peers[id];if(!p)return;
 if(p.m)p.m.close();delete peers[id];
 const t=g('t-'+id);if(t){t.remove();toast((p.name||'Someone')+' left')}
 layout();
}

function adopt(c){
 const id=c.peer,p=peers[id]=peers[id]||{};
 if(p.c&&p.c!==c){c.close();return}
 p.c=c;
 const hi=()=>c.send({...stMsg(),t:'hi',name:me.name,list:Object.keys(peers).filter(k=>k!=id&&peers[k].c&&peers[k].c.open)});
 c.open?hi():c.on('open',hi);
 c.on('data',d=>msg(id,d));
 c.on('close',()=>{if(peers[id]&&peers[id].c===c)drop(id)});
 c.on('error',()=>{if(peers[id]&&peers[id].c===c)drop(id)});
}
function link(id){
 return new Promise((res,rej)=>{
  if(peers[id]||id==peer.id)return res();
  peers[id]={};
  const bad='Couldn’t find that meeting. Check the code and try again.';
  const fail=()=>{delete peers[id];rej(bad)};
  const c=peer.connect(id,{reliable:true}),to=setTimeout(fail,9000);
  peer.on('error',e=>{if(e.type=='peer-unavailable'&&String(e.message).includes(id)){clearTimeout(to);fail()}});
  c.on('open',()=>{
   clearTimeout(to);adopt(c);
   const m=peer.call(id,stream);m.on('stream',s=>vid(id,s));peers[id].m=m;res();
  });
 });
}
function msg(id,d){
 const p=peers[id];if(!p||!d||typeof d!='object')return;
 if(d.t=='hi'){
  p.name=String(d.name||'Guest').slice(0,24);p.cam=!!d.cam;p.mic=!!d.mic;p.away=!!d.away;p.share=!!d.share;roster[id]=p.name;tile(id);
  if(Array.isArray(d.list))d.list.slice(0,20).forEach(x=>typeof x=='string'&&link(x).catch(()=>{}));
 }else if(d.t=='st'){p.cam=!!d.cam;p.mic=!!d.mic;p.away=!!d.away;p.share=!!d.share;tile(id)}
 else if(d.t=='bye')delete roster[id];
 else if(d.t=='chat'){const m=String(d.m||'').slice(0,500);addMsg(p.name,m);if(!g('chat').classList.contains('open')){un++;g('bd').textContent=un;g('bd').hidden=false;toast((p.name||'Guest')+': '+m)}}
 else if(d.t=='re'&&EM.includes(d.e))react(d.e,p.name);
}

function open(id){
 return new Promise((res,rej)=>{
  const p=new Peer(id,{config:{iceServers:ICE}}),t=setTimeout(()=>rej(0),10000);
  p.on('open',()=>{clearTimeout(t);res(p)});p.on('error',e=>{clearTimeout(t);rej(e)});
 });
}
function wire(){
 peer.on('connection',adopt);
 peer.on('call',m=>{m.answer(stream);m.on('stream',s=>vid(m.peer,s));(peers[m.peer]=peers[m.peer]||{}).m=m});
 peer.on('disconnected',()=>peer.reconnect());
 peer.on('error',e=>{if(e.type!='peer-unavailable')toast('Connection issue: '+e.type)});
}
async function enter(create){
 me.name=g('uname').value.trim().slice(0,24)||'Guest';
 try{localStorage.setItem('peace-name',me.name)}catch(e){}
 g('err').textContent='';setSplash(true,create?'Setting up your room…':'Joining…');
 try{
  if(create){
   for(let i=0;i<5&&!peer;i++){code=rid();try{peer=await open(pid(code))}catch(e){if(e.type!='unavailable-id')throw e}}
   if(!peer)throw 0;wire();
  }else{
   code=norm(g('jc').value);if(!code)throw 'Enter a meeting code first.';
   peer=await open();wire();await link(pid(code));
  }
 }catch(e){
  if(peer){peer.destroy();peer=null}
  setSplash(false);g('err').textContent=typeof e=='string'?e:'Couldn’t connect. Check your network and try again.';return;
 }
 g('lobby').hidden=true;g('room').hidden=false;g('rc').textContent=code;
 tile('me');sync();setSplash(false);keepAwake();
 if(create)toast('Meeting ready. Tap the code to copy the invite link.');
}

function addMsg(n,m,mine){
 const d=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');
 d.className='m'+(mine?' me':'');b.textContent=mine?'You':(n||'Guest');s.textContent=m;d.append(b,s);
 g('msgs').append(d);g('msgs').scrollTop=1e9;
}
function react(e,n){
 const el=document.createElement('div'),a=document.createElement('span'),b=document.createElement('small');
 el.className='fl';el.style.left=(6+Math.random()*80)+'%';a.textContent=e;b.textContent=n||'Guest';
 el.append(a,b);g('fx').append(el);setTimeout(()=>el.remove(),3100);
}
EM.forEach(e=>{const b=document.createElement('button');b.textContent=e;b.dataset.e=e;b.setAttribute('aria-label','React '+e);g('rp').append(b)});

document.addEventListener('click',e=>{
 if(!e.target.closest('#rp,[data-a=react]'))g('rp').hidden=true;
 document.querySelectorAll('.tile video').forEach(v=>v.paused&&v.play().catch(()=>{}));
 const b=e.target.closest('button');if(!b)return;
 const a=b.dataset.a;
 if(b.dataset.t)tog(b.dataset.t);
 else if(b.dataset.e){react(b.dataset.e,'You');bcast({t:'re',e:b.dataset.e})}
 else if(a=='flip')flip();
 else if(a=='share')share();
 else if(a=='react')g('rp').hidden=!g('rp').hidden;
 else if(a=='chat'){
  const c=g('chat');c.classList.toggle('open');
  if(c.classList.contains('open')){un=0;g('bd').hidden=true;g('ci').focus();g('msgs').scrollTop=1e9}
 }else if(a=='copy'){
  const url=location.href.split('#')[0]+'#'+code;
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Invite link copied'),()=>toast('Meeting code: '+code));
 }else if(a=='leave'){
  bcast({t:'bye'});
  setTimeout(()=>{if(peer)peer.destroy();stream.getTracks().forEach(t=>t.stop());history.replaceState(null,'',location.pathname+location.search);location.reload()},150);
 }
});
g('cf').onsubmit=e=>{
 e.preventDefault();const v=g('ci').value.trim();if(!v)return;
 g('ci').value='';addMsg(me.name,v,1);bcast({t:'chat',m:v});
};
g('jf').onsubmit=e=>{e.preventDefault();enter(false)};
g('new').onclick=()=>enter(true);
g('uname').oninput=e=>{me.name=e.target.value.trim()||'Guest';g('pav').textContent=ini(me.name)};
addEventListener('keydown',e=>{
 if(g('room').hidden||e.target.tagName=='INPUT'||e.ctrlKey||e.metaKey)return;
 if(e.key=='m')tog('mic');if(e.key=='v')tog('cam');
});
addEventListener('pagehide',e=>{if(peer&&!e.persisted){bcast({t:'bye'});peer.destroy()}});
document.addEventListener('visibilitychange',()=>{setAway();if(!document.hidden)revive()});
addEventListener('pageshow',e=>{if(e.persisted)revive()});
addEventListener('online',revive);

try{g('uname').value=localStorage.getItem('peace-name')||''}catch(e){}
g('pav').textContent=ini(g('uname').value);
if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)document.querySelector('[data-a=share]').hidden=false;
if(location.hash.length>1){g('jc').value=norm(location.hash);g('jc').focus()}
setTimeout(()=>{setSplash(false);getMedia()},2300);
</script>
</body>
</html>
