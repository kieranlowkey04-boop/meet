<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131020">
<title>Peace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✌️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("peace-theme")||"midnight"}catch(e){}</script>
<style>
:root{--bg:#131020;--panel:#1c1830;--line:#2f2947;--tx:#f4efe8;--mut:#a49fb8;--acc:#c9b8ff;--warm:#ffc9a3;--red:#ff6b7a;--btn:#2f2947;--btn2:#3c3459;--inp:#161227;--onacc:#1a1230;--g1:#4a2f6a55;--g2:#7a3f4a44;--bub:#4a3f7a;--av:#3a2b58;--sp:#2a1f45;--ring:#c9b8ff33;color-scheme:dark}
[data-theme=sunset]{--bg:#1a0d12;--panel:#2a1519;--line:#4a2a31;--tx:#fff3ea;--mut:#c9a59b;--acc:#ff9a62;--warm:#ffd08a;--red:#ff5d73;--btn:#3a1f25;--btn2:#4d2a32;--inp:#210f14;--onacc:#2a1208;--g1:#ff7a5a44;--g2:#c2358a33;--bub:#8a3d2e;--av:#5a2a2a;--sp:#3a1a1c;--ring:#ff9a6233;color-scheme:dark}
[data-theme=ocean]{--bg:#08141f;--panel:#0f2233;--line:#1d3a52;--tx:#eaf6ff;--mut:#8fb0c7;--acc:#6fd3ff;--warm:#a8f0e0;--red:#ff6b7a;--btn:#17324a;--btn2:#1f4260;--inp:#0a1b2b;--onacc:#052033;--g1:#1e7bbf44;--g2:#12a89a33;--bub:#1f5f8a;--av:#164766;--sp:#0e2d45;--ring:#6fd3ff33;color-scheme:dark}
[data-theme=forest]{--bg:#0c1710;--panel:#13251a;--line:#244230;--tx:#eef7ee;--mut:#9ab8a2;--acc:#8fe0a0;--warm:#e6d98a;--red:#ff7a6b;--btn:#1d3727;--btn2:#274832;--inp:#0e1c13;--onacc:#0b2013;--g1:#2f8a4a44;--g2:#8a7a2a33;--bub:#2f6a44;--av:#1f4a31;--sp:#17341f;--ring:#8fe0a033;color-scheme:dark}
[data-theme=bubblegum]{--bg:#1c0f1f;--panel:#2b1630;--line:#4a2a52;--tx:#fff0fa;--mut:#c9a5c9;--acc:#ff8ad8;--warm:#ffc2e8;--red:#ff5d7a;--btn:#3a1f42;--btn2:#4e2a58;--inp:#210f26;--onacc:#2a0c24;--g1:#ff5ac844;--g2:#7a3fff33;--bub:#8a3d88;--av:#5a2a5e;--sp:#3a1a44;--ring:#ff8ad833;color-scheme:dark}
[data-theme=light]{--bg:#f5f2fb;--panel:#ffffff;--line:#ded8ee;--tx:#1d1a2b;--mut:#6b6783;--acc:#6c4bd8;--warm:#c2561f;--red:#e5484d;--btn:#ebe6f7;--btn2:#ddd5f1;--inp:#ffffff;--onacc:#ffffff;--g1:#b9a2ff44;--g2:#ffc9a366;--bub:#d8cdfb;--av:#e6defa;--sp:#efe9fb;--ring:#6c4bd833;color-scheme:light}

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(55% 45% at 12% 0,var(--g1),transparent),radial-gradient(50% 45% at 95% 100%,var(--g2),transparent),var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.serif{font-family:Fraunces,Georgia,serif;font-weight:600}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#splash{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:14px;background:radial-gradient(circle at 50% 45%,var(--sp),var(--bg) 70%);transition:opacity .7s,visibility .7s}
#splash.off{opacity:0;visibility:hidden}
.hand{font-size:104px;line-height:1;display:inline-block;transform-origin:70% 90%;animation:wave 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 24px var(--ring))}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.lg{display:inline-block;line-height:1}
#splash h2{font-size:34px;letter-spacing:.04em;opacity:0;animation:fade .8s 1.5s forwards}
@keyframes fade{to{opacity:1}}
#sm{color:var(--mut);min-height:1.4em}

#lobby{height:100dvh;overflow:auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;align-items:center;max-width:1120px;margin:auto;padding:28px}
.pv{position:relative;aspect-ratio:4/3;border-radius:28px;overflow:hidden;background:var(--panel);box-shadow:0 30px 80px #0009}
.pv video{width:100%;height:100%;object-fit:cover;display:block}
.pv.mir video{transform:scaleX(-1)}
.pv .ctl{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:12px}
.side{display:grid;gap:14px;max-width:420px}
.side h1{font-size:60px;line-height:1;display:flex;align-items:center;gap:14px}
.side h1 .lg{font-size:52px}
.side p{color:var(--mut)}
label{display:grid;gap:6px;color:var(--mut);font-size:13px}
input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--inp);color:var(--tx);font:inherit;outline:0}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
.pri{width:100%;padding:14px;border-radius:14px;background:var(--acc);color:var(--onacc);font-weight:700;transition:transform .15s}
.pri:hover{transform:translateY(-1px)}
.sec{padding:0 22px;border-radius:14px;background:var(--btn);font-weight:600}
.sec:hover{background:var(--btn2)}
.or{color:var(--mut);font-size:13px;text-align:center}
#jf{display:flex;gap:8px}
#err{color:var(--red);min-height:1.4em}

#room{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px}
.brand .lg{font-size:26px}
.hr{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px}
.pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--tx)}
.pill svg{width:15px;height:15px}
#stage{flex:1;min-height:0;display:flex;gap:12px;padding:0 14px}
#grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--c,1),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:12px}
.tile{transition:box-shadow .15s;position:relative;min-height:0;background:var(--panel);border-radius:22px;overflow:hidden}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.self.mir video{transform:scaleX(-1)}
.tile.share video{object-fit:contain;background:#000}
.tile.big{grid-column:1/-1;grid-row:span 3}
.away .nm::before{content:"💤 "}
.tile.nocam video{visibility:hidden}
.av{display:none;position:absolute;inset:0;place-items:center;font:600 clamp(40px,9vw,88px)/1 Fraunces,Georgia,serif;color:var(--warm);background:radial-gradient(circle,var(--av),var(--panel))}
.nocam .av{display:grid}
.nm{color:#fff;position:absolute;left:12px;bottom:12px;padding:4px 12px;border-radius:999px;background:#0008;backdrop-filter:blur(8px);font-size:13px}
.muted .nm::after{content:" 🔇"}
#chat{display:none;flex-direction:column;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}
#chat.open{display:flex}
#chat h3{padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line)}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
#msgs:empty::before{content:"No messages yet. Say hi!";color:var(--mut);margin:auto}
.m{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--btn);align-self:flex-start;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--bub)}
.m b{display:block;font-size:12px;color:var(--warm);font-weight:600}
.m.me b{color:var(--acc)}
#cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.bar{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:14px}
.rb{position:relative;width:52px;height:52px;border-radius:50%;background:var(--btn);display:grid;place-items:center;transition:background .2s,transform .15s}
.rb:hover{background:var(--btn2);transform:translateY(-2px)}
.rb.on{background:var(--acc);color:var(--onacc)}
.rb.off{background:var(--red);color:#fff}
.rb.off::after{content:"";position:absolute;width:28px;height:2.5px;border-radius:2px;background:#fff;transform:rotate(-45deg)}
.rb:disabled{opacity:.4;cursor:not-allowed}
.rb.end{width:68px;border-radius:26px;background:var(--red);color:#fff}
.rb.end svg{transform:rotate(135deg)}
#bd{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--warm);color:#2a1a10;font-size:12px;font-weight:700;display:grid;place-items:center}
#rp{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px #0008;z-index:15}
#rp button{font-size:26px;width:46px;height:46px;border-radius:50%;transition:transform .15s}
#rp button:hover{transform:scale(1.3)}
.sw{position:relative;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{width:38px;height:22px;border-radius:11px;background:var(--btn2);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(16px);background:var(--onacc)}
.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
.bar .sw{position:absolute;left:18px;top:50%;transform:translateY(-50%)}
.pop{border-radius:18px;position:absolute;left:50%;top:50%;width:min(70%,260px);max-height:80%;object-fit:contain;pointer-events:none;z-index:2;filter:drop-shadow(0 10px 24px #0009);animation:pp 1.3s ease-out forwards}
@keyframes pp{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1.12) rotate(4deg);opacity:1}26%{transform:translate(-50%,-50%) scale(1) rotate(0)}82%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.fl{position:absolute;bottom:100px;display:grid;justify-items:center;gap:4px;animation:up 3s ease-out forwards}
.fl span{font-size:48px}
.fl small{color:#fff;background:#0009;padding:2px 9px;border-radius:99px;font-size:12px}
@keyframes up{0%{transform:translateY(0) scale(.5);opacity:0}12%{opacity:1;transform:translateY(-24px) scale(1)}100%{transform:translateY(-58vh) rotate(8deg) scale(1.15);opacity:0}}
#tst{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:var(--btn2);padding:10px 18px;border-radius:999px;z-index:60;transition:transform .3s;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tst.on{transform:translate(-50%,0)}

.tk{display:flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tk b{color:var(--tx);font-weight:600}
.host .nm::before{content:"👑 "}
.kick{color:#fff;position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;background:#000a;backdrop-filter:blur(8px);display:grid;place-items:center;font-size:15px;opacity:0;transition:opacity .15s,background .15s}
.tile:hover .kick,.kick:focus-visible{opacity:1}
.kick:hover{background:var(--red)}
@media(pointer:coarse){.kick{opacity:1}}
@media(max-width:480px){#ckw{display:none}}
.th{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:5;font-size:22px}
#tp{position:fixed;right:14px;top:calc(66px + env(safe-area-inset-top));z-index:40;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px #0008}
#tp button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--btn);font-size:13px;font-weight:600;white-space:nowrap}
#tp button:hover{background:var(--btn2)}
#tp button.on{outline:2px solid var(--acc)}
#tp i{display:flex;padding-left:4px}
#tp i b{width:14px;height:14px;border-radius:50%;margin-left:-4px;border:1px solid #0004}
.rb.em{font-size:22px}
.tile.talk{box-shadow:0 0 0 3px var(--acc),0 0 26px var(--ring)}
.tile{cursor:pointer}
.hb{display:none;position:absolute;top:10px;left:10px;z-index:3;width:42px;height:42px;border-radius:50%;background:#000a;place-items:center;font-size:24px}
.raised .hb{display:grid;animation:wob 1s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(14deg) scale(1.1)}}
#fp{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:40;width:min(92vw,440px);max-height:60vh;overflow:auto;padding:14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px #0008;display:grid;gap:8px}
#fp h4{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.gr{display:flex;flex-wrap:wrap;gap:6px}
.gr button{padding:8px 12px;border-radius:12px;background:var(--btn);font-size:13px;font-weight:600}
.gr button:hover{background:var(--btn2)}.gr button.on{outline:2px solid var(--acc)}
#bn{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;pointer-events:none;z-index:35;max-width:min(90vw,520px);text-align:center;padding:14px 20px;border-radius:20px;background:var(--panel);border:1px solid var(--acc);font:600 18px/1.3 Fraunces,Georgia,serif;box-shadow:0 14px 50px #0009;transition:.3s}
#bn.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){
 #lobby{grid-template-columns:1fr;gap:22px;align-content:start}
 .pv{aspect-ratio:16/11}.side h1{font-size:44px}.side{max-width:none}
 #chat.open{position:fixed;inset:64px 10px 140px;width:auto;z-index:20}
 .bar .sw{position:static;transform:none;order:-1;width:100%;justify-content:center}
 .hr span{display:none}
}
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
 <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc9a3"/><stop offset="1" stop-color="#c9b8ff"/></linearGradient></defs>
 <symbol id="pc" viewBox="0 0 100 100"><g fill="none" stroke="url(#gr)" stroke-width="6" stroke-linecap="round"><circle cx="50" cy="50" r="42"/><path d="M50 8V92M50 50L20.3 79.7M50 50L79.7 79.7"/></g></symbol>
 <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></symbol>
 <symbol id="i-cam" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/></symbol>
 <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></symbol>
 <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></symbol>
 <symbol id="i-end" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
 <symbol id="i-link" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
 <symbol id="i-flip" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8M3 3v5h5M3 12a9 9 0 0 0 15.5 6.2L21 16M21 21v-5h-5"/></symbol>
 <symbol id="i-share" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
</svg>

<div id="splash">
 <div class="hand" role="img" aria-label="Peace">✌️</div>
 <h2 class="serif">Peace</h2><p id="sm"></p>
</div>

<main id="lobby">
 <button class="rb th" data-a="theme" aria-label="Change theme">🎨</button>
 <section class="pv mir">
  <video id="pv" autoplay playsinline muted></video><div class="av" id="pav">?</div>
  <div class="ctl">
   <button class="rb" data-t="mic" aria-label="Toggle microphone (M)"><svg class="i"><use href="#i-mic"/></svg></button>
   <button class="rb" data-t="cam" aria-label="Toggle camera (V)"><svg class="i"><use href="#i-cam"/></svg></button>
   <button class="rb" data-a="flip" hidden aria-label="Flip camera"><svg class="i"><use href="#i-flip"/></svg></button>
  </div>
 </section>
 <section class="side">
  <h1 class="serif"><span class="lg">✌️</span>Peace</h1>
  <p>Free video calls with a meeting code. No sign-up, no downloads.</p>
  <label>Your name<input id="uname" maxlength="24" placeholder="What should we call you?" autocomplete="nickname"></label>
  <button class="pri" id="new">Start a new meeting</button>
  <div class="or">or join with a code</div>
  <form id="jf"><input id="jc" placeholder="abc-defg-hij" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="sec">Join</button></form>
  <div id="err" role="alert"></div>
 </section>
</main>

<main id="room" hidden>
 <header>
  <div class="brand serif"><span class="lg">✌️</span>Peace</div>
  <div class="hr"><span id="cnt"></span><div class="tk" title="Time in call">⏱ <b id="tm">0:00</b></div><div class="tk" id="ckw" title="Current time">🕐 <b id="ck"></b></div><button class="pill" data-a="copy" aria-label="Copy invite link"><svg class="i"><use href="#i-link"/></svg><b id="rc"></b></button></div>
 </header>
 <div id="stage">
  <div id="grid"></div>
  <aside id="chat"><h3>Chat</h3><div id="msgs"></div>
   <form id="cf"><input id="ci" placeholder="Message everyone" autocomplete="off" maxlength="500"><button class="sec">Send</button></form>
  </aside>
 </div>
 <div class="bar">
  <div id="rp" hidden></div>
  <label class="sw" title="Pop up a meme when your face matches"><input type="checkbox" id="mt" checked><i></i><span>Face memes</span></label>
  <button class="rb" data-t="mic" aria-label="Toggle microphone (M)"><svg class="i"><use href="#i-mic"/></svg></button>
  <button class="rb" data-t="cam" aria-label="Toggle camera (V)"><svg class="i"><use href="#i-cam"/></svg></button>
  <button class="rb" data-a="flip" hidden aria-label="Flip camera"><svg class="i"><use href="#i-flip"/></svg></button>
  <button class="rb" data-a="share" hidden aria-label="Share screen"><svg class="i"><use href="#i-share"/></svg></button>
  <button class="rb em" data-a="muteall" hidden aria-label="Mute everyone" title="Mute everyone">🔇</button>
  <button class="rb em" data-a="fun" aria-label="Soundboard, vibes and party" title="Soundboard, vibes &amp; party">✨</button>
  <button class="rb em" data-a="hand" aria-label="Raise hand" title="Raise hand (H)">✋</button>
  <button class="rb em" data-a="theme" aria-label="Themes" title="Themes">🎨</button>
  <button class="rb" data-a="react" aria-label="Reactions"><svg class="i"><use href="#i-smile"/></svg></button>
  <button class="rb" data-a="chat" aria-label="Chat"><svg class="i"><use href="#i-chat"/></svg><i id="bd" hidden></i></button>
  <button class="rb end" data-a="leave" aria-label="Leave meeting"><svg class="i"><use href="#i-end"/></svg></button>
 </div>
</main>
<div id="tp" hidden aria-label="Themes"></div><div id="bn" role="status"></div>
<div id="fp" hidden><h4>Soundboard</h4><div class="gr" id="fs"></div><h4>Vibes (everyone sees your look)</h4><div class="gr" id="fv"></div><h4>Party</h4><div class="gr" id="fq"></div><h4>View</h4><div class="gr"><button data-a="hideme">🙈 Hide my view</button></div><label class="sw"><input type="checkbox" id="ns"><i></i><span>Mute sounds from others</span></label></div><div id="fx"></div><div id="tst" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const g=id=>document.getElementById(id);
const EM=['✌️','❤️','😂','👏','🎉','😮','🔥','👍'];
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},
 {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}];
const me={name:'Guest',cam:true,mic:true,has:{},mirror:true,sharing:false,away:false,canFlip:false,host:false,hand:false,fx:''},peers={},roster={};
let wl;
let stream,peer,code,un=0,tt,t0=0;
const ini=n=>([...(n||'').trim()][0]||'?').toUpperCase();
const norm=s=>{s=s.trim().toLowerCase();if(s.includes('#'))s=s.split('#').pop();return s.replace(/[^a-z-]/g,'')};
const rid=()=>{const a='abcdefghjkmnpqrstuvwxyz',r=n=>[...Array(n)].map(()=>a[Math.random()*a.length|0]).join('');return r(3)+'-'+r(4)+'-'+r(3)};
const pid=c=>'peace-'+c;
const bcast=d=>Object.values(peers).forEach(p=>p.c&&p.c.open&&p.c.send(d));
const stMsg=()=>({t:'st',cam:me.cam,mic:me.mic,away:me.away,share:me.sharing,hand:me.hand,fx:me.fx});

function setSplash(on,m){g('splash').classList.toggle('off',!on);g('sm').textContent=m||''}
function toast(m){const t=g('tst');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

async function getMedia(){
 for(const c of [{video:{facingMode:'user'},audio:true},{audio:true},{video:true}]){
  try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){}
 }
 me.has={cam:!!stream&&stream.getVideoTracks().length>0,mic:!!stream&&stream.getAudioTracks().length>0};
 if(!stream)stream=new MediaStream();
 if(!stream.getVideoTracks().length)stream.addTrack(document.createElement('canvas').captureStream().getVideoTracks()[0]);
 me.cam=me.has.cam;me.mic=me.has.mic;
 try{me.canFlip=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind=='videoinput').length>1}catch(e){}
 me.mirror=(stream.getVideoTracks()[0].getSettings().facingMode||'user')!='environment';
 g('pv').srcObject=stream;sync();
 if(!me.has.cam&&!me.has.mic)g('err').textContent='No camera or mic available. You can still join and watch.';
}
function sync(){
 document.querySelectorAll('[data-t]').forEach(b=>{const k=b.dataset.t;b.classList.toggle('off',!me[k]);b.disabled=!me.has[k]||(k=='cam'&&me.sharing)});
 document.querySelectorAll('[data-a=flip]').forEach(b=>{b.hidden=!me.canFlip||!me.has.cam||me.sharing});
 document.querySelectorAll('[data-a=share]').forEach(b=>b.classList.toggle('on',me.sharing));
 const pv=g('pv').parentNode;pv.classList.toggle('nocam',!me.cam);pv.classList.toggle('mir',me.mirror);
 const s=g('t-me');if(s){s.classList.toggle('nocam',!me.cam);s.classList.toggle('muted',!me.mic);s.classList.toggle('mir',me.mirror);s.classList.toggle('share',me.sharing)}
 layout();
}
function localView(){
 const s=new MediaStream(stream.getTracks()),t=g('t-me');
 [g('pv'),t&&t.querySelector('video')].forEach(v=>v&&(v.srcObject=s));
}
function swap(nt,keep){
 const old=stream.getTracks().find(t=>t.kind==nt.kind);
 if(old){stream.removeTrack(old);if(!keep)old.stop()}
 stream.addTrack(nt);
 Object.values(peers).forEach(p=>p.m&&p.m.peerConnection&&p.m.peerConnection.getSenders().forEach(x=>{if(x.track&&x.track.kind==nt.kind)x.replaceTrack(nt).catch(()=>{})}));
 localView();
}
async function flip(){
 const cur=stream.getVideoTracks()[0],fm=cur.getSettings().facingMode;
 const gum=c=>navigator.mediaDevices.getUserMedia({video:c}).then(s=>s.getVideoTracks()[0]);
 let nt;
 try{
  let c;
  if(fm)c={facingMode:{exact:fm=='user'?'environment':'user'}};
  else{
   const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind=='videoinput'),i=ds.findIndex(d=>d.deviceId==cur.getSettings().deviceId);
   c={deviceId:{exact:ds[(i+1)%ds.length].deviceId}};
  }
  cur.stop();nt=await gum(c);
 }catch(e){
  toast('Couldn’t switch camera');
  try{nt=await gum(fm?{facingMode:fm}:true)}catch(e2){return}
 }
 nt.enabled=me.cam;swap(nt);
 me.mirror=nt.getSettings().facingMode!='environment';sync();
}
async function share(){
 if(me.sharing)return stopShare();
 let st;try{st=(await navigator.mediaDevices.getDisplayMedia({video:true})).getVideoTracks()[0]}catch(e){return}
 me.prev={t:stream.getVideoTracks()[0],cam:me.cam,mirror:me.mirror};
 st.onended=stopShare;swap(st,true);
 me.sharing=true;me.cam=true;me.mirror=false;sync();bcast(stMsg());
}
async function stopShare(){
 if(!me.sharing)return;
 const p=me.prev;me.sharing=false;me.cam=p.cam;me.mirror=p.mirror;
 if(p.t.readyState=='live')swap(p.t);else await regain('video');
 sync();bcast(stMsg());
}
async function regain(k){
 if(!me.has[k=='video'?'cam':'mic']||(k=='video'&&me.sharing))return;
 try{
  const c=k=='video'?{video:{facingMode:me.mirror?'user':'environment'}}:{audio:true};
  const nt=(await navigator.mediaDevices.getUserMedia(c)).getTracks()[0];
  nt.enabled=k=='video'?me.cam:me.mic;swap(nt);
 }catch(e){}
}
async function keepAwake(){try{if(navigator.wakeLock&&!g('room').hidden)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function setAway(){
 me.away=document.hidden&&!me.sharing&&matchMedia('(pointer:coarse)').matches;
 bcast(stMsg());
}
async function revive(){
 if(!peer||g('room').hidden)return;
 keepAwake();
 if(peer.disconnected&&!peer.destroyed)peer.reconnect();
 document.querySelectorAll('.tile video').forEach(v=>v.paused&&v.play().catch(()=>{}));
 await new Promise(r=>setTimeout(r,900));
 for(const k of ['video','audio']){
  const t=stream.getTracks().find(x=>x.kind==k);
  if(!t||t.readyState=='ended'||(t.muted&&!me.sharing))await regain(k);
 }
 Object.keys(roster).forEach(id=>{const p=peers[id];if(!(p&&p.c&&p.c.open))link(id).catch(()=>{})});
}
function tog(k){
 if(!me.has[k]||(me.sharing&&k=='cam'))return;
 const t=(k=='cam'?stream.getVideoTracks():stream.getAudioTracks())[0];
 me[k]=!me[k];t.enabled=me[k];sync();bcast(stMsg());
}

function tile(id){
 const self=id=='me',p=self?me:peers[id];if(!p)return;
 let t=g('t-'+id);
 if(!t){
  t=document.createElement('div');t.id='t-'+id;t.className='tile'+(self?' self':'');
  t.innerHTML='<video autoplay playsinline></video><div class="av"></div><div class="nm"></div><div class="hb">✋</div>';
  g('grid').append(t);
  if(me.host&&!self){const k=document.createElement('button');k.className='kick';k.dataset.k=id;k.title='Remove from meeting';k.setAttribute('aria-label','Remove from meeting');k.textContent='✕';t.append(k)}
  if(self){const v=t.querySelector('video');v.muted=true;v.srcObject=stream}
 }
 const n=p.name||'Guest';
 t.querySelector('.av').textContent=ini(n);
 t.querySelector('.nm').textContent=n+(self?' (you)':'');
 t.classList.toggle('nocam',!p.cam||(!self&&!!p.away));t.classList.toggle('muted',!p.mic);t.classList.toggle('away',!self&&!!p.away);t.classList.toggle('share',self?me.sharing:!!p.share);t.classList.toggle('mir',self&&me.mirror);t.classList.toggle('host',self?me.host:!!code&&id==pid(code));t.classList.toggle('raised',!!(self?me.hand:p.hand));t.querySelector('video').style.filter=FX[self?me.fx:p.fx]||'';
 layout();
}
function layout(){
 const all=g('grid').children.length,n=[...g('grid').children].filter(c=>!c.hidden).length,w=innerWidth<800;
 document.querySelectorAll('.tile.big').forEach(t=>t.classList.remove('big'));
 const sh=document.querySelector('.tile.share')||document.querySelector('.tile.pin');if(sh)sh.classList.add('big');
 g('grid').style.setProperty('--c',sh?Math.max(1,Math.min(n-1,w?2:4)):n<2?1:w?(n<3?1:2):n<5?2:n<10?3:4);
 g('cnt').textContent=all+(all>1?' people':' person');
}
addEventListener('resize',layout);
function vid(id,s){
 if(!peers[id])peers[id]={};
 tile(id);const v=g('t-'+id).querySelector('video');if(v.srcObject!==s)v.srcObject=s;listen(id,s);
}
function drop(id){
 const p=peers[id];if(!p)return;
 if(p.m)p.m.close();delete peers[id];try{p.c&&p.c.close()}catch(e){}
 const t=g('t-'+id);if(t){t.remove();toast((p.name||'Someone')+' left');chime(false)}
 layout();
}

function removed(){
 try{sessionStorage.setItem('peace-note','The host removed you from the meeting.')}catch(e){}
 try{peer&&peer.destroy()}catch(e){}
 stream.getTracks().forEach(t=>t.stop());
 history.replaceState(null,'',location.pathname+location.search);location.reload();
}
function kick(id){
 const p=peers[id];if(!me.host||!p)return;
 if(!confirm('Remove '+(p.name||'this person')+' from the meeting?'))return;
 try{p.c&&p.c.open&&p.c.send({t:'kick'})}catch(e){}
 delete roster[id];bcast({t:'gone',id});
 setTimeout(()=>drop(id),250);
}
function adopt(c){
 const id=c.peer,p=peers[id]=peers[id]||{};
 if(p.c&&p.c!==c){c.close();return}
 p.c=c;
 const hi=()=>c.send({...stMsg(),t:'hi',name:me.name,el:t0?Date.now()-t0:0,list:Object.keys(peers).filter(k=>k!=id&&peers[k].c&&peers[k].c.open)});
 c.open?hi():c.on('open',hi);
 c.on('data',d=>msg(id,d));
 c.on('close',()=>{if(peers[id]&&peers[id].c===c)drop(id)});
 c.on('error',()=>{if(peers[id]&&peers[id].c===c)drop(id)});
}
function link(id){
 return new Promise((res,rej)=>{
  if(peers[id]||id==peer.id)return res();
  peers[id]={};
  const bad='Couldn’t find that meeting. Check the code and try again.';
  const fail=()=>{delete peers[id];rej(bad)};
  const c=peer.connect(id,{reliable:true}),to=setTimeout(fail,9000);
  peer.on('error',e=>{if(e.type=='peer-unavailable'&&String(e.message).includes(id)){clearTimeout(to);fail()}});
  c.on('open',()=>{
   clearTimeout(to);adopt(c);
   const m=peer.call(id,stream);m.on('stream',s=>vid(id,s));peers[id].m=m;res();
  });
 });
}
function msg(id,d){
 const p=peers[id];if(!p||!d||typeof d!='object')return;
 if(d.t=='hi'){
  p.name=String(d.name||'Guest').slice(0,24);p.cam=!!d.cam;p.mic=!!d.mic;p.away=!!d.away;p.share=!!d.share;p.hand=!!d.hand;p.fx=FXK.includes(d.fx)?d.fx:'';const fresh=!roster[id];roster[id]=p.name;tile(id);if(fresh&&!g('room').hidden){chime(true);toast(p.name+' joined')}const el=+d.el||0;if(el>(t0?Date.now()-t0:0))t0=Date.now()-el;
  if(Array.isArray(d.list))d.list.slice(0,20).forEach(x=>typeof x=='string'&&link(x).catch(()=>{}));
 }else if(d.t=='st'){p.cam=!!d.cam;p.mic=!!d.mic;p.away=!!d.away;p.share=!!d.share;const hh=!!d.hand;if(hh&&!p.hand){toast('✋ '+(p.name||'Someone')+' raised a hand');chime(true)}p.hand=hh;p.fx=FXK.includes(d.fx)?d.fx:'';tile(id)}
 else if(d.t=='bye')delete roster[id];
 else if(d.t=='kick'&&code&&id==pid(code))removed();
 else if(d.t=='muteall'&&code&&id==pid(code)){if(me.mic){tog('mic');toast('The host muted everyone')}}
 else if(d.t=='snd'&&SNDK.includes(d.k)&&!g('ns').checked&&Date.now()-(p.sa||0)>900){p.sa=Date.now();sfx(d.k)}
 else if(d.t=='say'&&Date.now()-(p.ya||0)>600){p.ya=Date.now();banner(String(d.m||'').slice(0,160),p.name)}
 else if(d.t=='gone'&&code&&id==pid(code)&&typeof d.id=='string'){delete roster[d.id];if(!peer||d.id!=peer.id)drop(d.id)}
 else if(d.t=='meme'&&MKEYS.includes(d.k))pop(id,d.k);
 else if(d.t=='chat'){const m=String(d.m||'').slice(0,500);addMsg(p.name,m);if(!g('chat').classList.contains('open')){un++;g('bd').textContent=un;g('bd').hidden=false;toast((p.name||'Guest')+': '+m)}}
 else if(d.t=='re'&&EM.includes(d.e))react(d.e,p.name);
}

function open(id){
 return new Promise((res,rej)=>{
  const p=new Peer(id,{config:{iceServers:ICE}}),t=setTimeout(()=>rej(0),10000);
  p.on('open',()=>{clearTimeout(t);res(p)});p.on('error',e=>{clearTimeout(t);rej(e)});
 });
}
function wire(){
 peer.on('connection',adopt);
 peer.on('call',m=>{m.answer(stream);m.on('stream',s=>vid(m.peer,s));(peers[m.peer]=peers[m.peer]||{}).m=m});
 peer.on('disconnected',()=>peer.reconnect());
 peer.on('error',e=>{if(e.type!='peer-unavailable')toast('Connection issue: '+e.type)});
}
async function enter(create){
 me.name=g('uname').value.trim().slice(0,24)||'Guest';
 try{localStorage.setItem('peace-name',me.name)}catch(e){}
 g('err').textContent='';setSplash(true,create?'Setting up your room…':'Joining…');
 try{
  if(create){
   for(let i=0;i<5&&!peer;i++){code=rid();try{peer=await open(pid(code))}catch(e){if(e.type!='unavailable-id')throw e}}
   if(!peer)throw 0;wire();
  }else{
   code=norm(g('jc').value);if(!code)throw 'Enter a meeting code first.';
   peer=await open();wire();await link(pid(code));
  }
 }catch(e){
  if(peer){peer.destroy();peer=null}
  setSplash(false);g('err').textContent=typeof e=='string'?e:'Couldn’t connect. Check your network and try again.';return;
 }
 g('lobby').hidden=true;g('room').hidden=false;g('rc').textContent=code;me.host=!!create;t0=t0||Date.now();document.querySelector('[data-a=muteall]').hidden=!me.host;
 tile('me');sync();listen('me',stream);setSplash(false);keepAwake();startFace();
 if(create)toast('Meeting ready. Tap the code to copy the invite link.');
}

const MKEYS=['shock','sad','angry','happy','side','finger','point','idk'],
 EMO={shock:'😮',sad:'😢',angry:'😠',happy:'😄',side:'👀',finger:'🖕',point:'☝️',idk:'🤷'};
let fl,hl,fTimer,fired='',coolUntil=0,last={k:'',n:0};
window.dbg=window.dbg||function(){};/* MediaPipe's wasm loader calls a global dbg() */
const DEBUG=location.search.includes('debug'),TH={smile:.5,jaw:.4,wide:.25,brow:.4,down:.14,frown:.1,look:.45,shrug:.35};
function pop(id,k){
 const t=g('t-'+id);if(!t)return;
 t.querySelectorAll('.pop').forEach(x=>x.remove());
 let el;
 if(MEME[k]){el=new Image();el.src=MEME[k];el.alt=''}
 else{el=document.createElement('div');el.textContent=EMO[k]||'';el.style.cssText='font-size:96px;line-height:1;text-align:center'}
 el.className='pop';t.append(el);setTimeout(()=>el.remove(),1400);
}
const sc=(m,a,b)=>((m[a]||0)+(m[b]||0))/2;
const CAL=8,B={};let calN=0;
function feat(cats){
 const m={};cats.forEach(x=>m[x.categoryName]=x.score);
 return{smile:sc(m,'mouthSmileLeft','mouthSmileRight'),frown:sc(m,'mouthFrownLeft','mouthFrownRight'),
  wide:sc(m,'eyeWideLeft','eyeWideRight'),down:sc(m,'browDownLeft','browDownRight'),
  press:sc(m,'mouthPressLeft','mouthPressRight'),sneer:sc(m,'noseSneerLeft','noseSneerRight'),
  squint:sc(m,'eyeSquintLeft','eyeSquintRight'),shrug:m.mouthShrugLower||0,
  look:Math.max(sc(m,'eyeLookOutLeft','eyeLookInRight'),sc(m,'eyeLookInLeft','eyeLookOutRight')),
  jaw:m.jawOpen||0,up:m.browInnerUp||0};
}
/* angry, sad and idk compare against YOUR neutral face (learned in the first second
   after you join, then slowly kept up to date), so they work for any face and lighting */
function mood(cats){
 const f=feat(cats),d={};
 if(calN<CAL){for(const x in f)B[x]=(B[x]||0)+f[x]/CAL;calN++;return['',f,d]}
 for(const x in f)d[x]=f[x]-B[x];
 const k=f.smile>TH.smile?'happy'
  :f.jaw>TH.jaw&&f.smile<.3&&(f.wide>TH.wide||f.up>TH.brow)?'shock'
  :(d.shrug>TH.shrug&&d.frown<.2||d.shrug>.25&&d.up>.12&&d.frown<.2)&&f.jaw<.3?'idk'
  :(f.down>.4||d.down>TH.down||(d.down>.07&&(d.press>.08||d.sneer>.08||d.squint>.12||d.frown>.1)))&&f.jaw<.6?'angry'
  :(d.frown>TH.frown||(d.up>.2&&d.frown>.04))&&f.jaw<.35?'sad'
  :f.look>TH.look&&f.jaw<.3?'side':'';
 if(!k)for(const x in f)B[x]+=(f[x]-B[x])*.01;
 return[k,f,d];
}
function hand(lm){
 const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z),w=lm[0];
 const r=[[8,5],[12,9],[16,13],[20,17]].map(([t,b])=>d(lm[t],w)/d(lm[b],w));
 const e=r.map(x=>x>1.55),c=r.map(x=>x<1.35);
 const k=e[1]&&c[0]&&c[2]&&c[3]?'finger':e[0]&&c[1]&&c[2]&&c[3]?'point':'';
 return[k,r];
}

const VER='0.10.14',
 BASES=['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+VER,'https://unpkg.com/@mediapipe/tasks-vision@'+VER],
 MURL='https://storage.googleapis.com/mediapipe-models/',
 MODELS={face:'face_landmarker/face_landmarker/float16/1/face_landmarker.task',hand:'hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'};
let loading;

async function model(key){
 const url=MURL+MODELS[key],get=async()=>{const r=await fetch(url);if(!r.ok)throw new Error('model '+r.status);return r};
 try{
  const c=await caches.open('peace-models'),hit=await c.match(url);
  if(hit)return new Uint8Array(await hit.arrayBuffer());
  const r=await get();c.put(url,r.clone()).catch(()=>{});
  return new Uint8Array(await r.arrayBuffer());
 }catch(e){return new Uint8Array(await (await get()).arrayBuffer())}
}
async function loadLib(){
 let err;
 for(const B of BASES){
  try{const v=await import(B+'/vision_bundle.mjs');return[v,await v.FilesetResolver.forVisionTasks(B+'/wasm')]}catch(e){err=e}
 }
 throw err;
}
async function mk(fs,C,buf,x,delegates){
 let err;
 for(const d of delegates){
  try{return await C.createFromOptions(fs,{baseOptions:{modelAssetBuffer:buf.slice(),delegate:d},runningMode:'VIDEO',...x})}catch(e){err=e}
 }
 throw err;
}
function loadFace(){
 return loading=loading||(async()=>{
  const [[v,fs],fb,hb]=await Promise.all([loadLib(),model('face'),model('hand').catch(()=>null)]);
  fl=await mk(fs,v.FaceLandmarker,fb,{outputFaceBlendshapes:true,numFaces:1},['GPU','CPU']);
  if(hb)mk(fs,v.HandLandmarker,hb,{numHands:1},['CPU']).then(h=>hl=h).catch(()=>{});
 })().catch(e=>{loading=null;throw e});
}
async function startFace(){
 if(!g('mt').checked)return;

  toast('Loading face memes…');
  try{await loadFace()}
  catch(e){console.error('Face memes:',e);g('mt').checked=false;toast('Face memes failed: '+String(e&&e.message||e).slice(0,50)+' (toggle to retry)');return}
  toast('Face memes on');
 }
 if(g('mt').checked)faceLoop();
}
function faceLoop(){
 clearTimeout(fTimer);
 if(!g('mt').checked||g('room').hidden)return;
 const t=g('t-me'),v=t&&t.querySelector('video');
 try{
  if(v&&v.readyState>=2&&me.cam&&!me.sharing&&!document.hidden){
   const ts=performance.now(),r=fl.detectForVideo(v,ts),c=r.faceBlendshapes&&r.faceBlendshapes[0];
   let [k,info,dl]=c?mood(c.categories):['',{},{}],h='',hr=[];
   if(hl){const x=hl.detectForVideo(v,ts);if(x.worldLandmarks&&x.worldLandmarks[0])[h,hr]=hand(x.worldLandmarks[0])}
   k=h||k;
   last.n=k&&k==last.k?last.n+1:1;last.k=k;
   if(!k)fired='';
   if(k&&last.n>=(k=='side'?3:2)&&k!==fired&&Date.now()>coolUntil){fired=k;coolUntil=Date.now()+3500;pop('me',k);bcast({t:'meme',k})}
   if(DEBUG){
    let d=g('dbgbox');
    if(!d){d=document.createElement('pre');d.id='dbgbox';d.style.cssText='position:fixed;left:8px;top:60px;z-index:70;background:#000a;padding:6px;border-radius:8px;font:11px monospace;pointer-events:none;margin:0';document.body.append(d)}
    d.textContent=Object.entries(info).map(([a,b])=>a+' '+b.toFixed(2)+' ('+(dl[a]>=0?'+':'')+(dl[a]||0).toFixed(2)+')').join('\n')+'\nfingers '+hr.map(x=>x.toFixed(2)).join(' ')+'\nhand: '+(h||'-')+'\nmood: '+(k||'-');
   }
  }
 }catch(e){}
 fTimer=setTimeout(faceLoop,130);
}

/* speaking ring + join/leave chime */
const AC=window.AudioContext||window.webkitAudioContext,an={};let ac;
function ctx(){try{ac=ac||new AC();if(ac.state=='suspended')ac.resume();return ac}catch(e){}}
function listen(id,s){
 if(!s.getAudioTracks().length||(an[id]&&an[id].s===s))return;
 const c=ctx();if(!c)return;
 try{const a=c.createAnalyser();a.fftSize=256;c.createMediaStreamSource(s).connect(a);an[id]={s,a,buf:new Uint8Array(a.frequencyBinCount)}}catch(e){}
}
setInterval(()=>{for(const id in an){const o=an[id],t=g('t-'+id);if(!t){delete an[id];continue}o.a.getByteFrequencyData(o.buf);t.classList.toggle('talk',o.buf.reduce((x,y)=>x+y,0)/o.buf.length>16)}},150);
function chime(up){
 const c=ctx();if(!c)return;
 try{const o=c.createOscillator(),v=c.createGain(),n=c.currentTime;o.frequency.value=up?880:520;v.gain.setValueAtTime(.06,n);v.gain.exponentialRampToValueAtTime(.0001,n+.28);o.connect(v);v.connect(c.destination);o.start(n);o.stop(n+.3)}catch(e){}
}

function sfx(k){
 if(CLIPS[k]){const a=new Audio(CLIPS[k]);a.volume=.8;a.play().catch(()=>{});return}
 const c=ctx();if(!c)return;const n=c.currentTime,out=c.createGain();out.gain.value=.25;out.connect(c.destination);
 const osc=(type,f0,f1,t0,d,vol=1)=>{const o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,n+t0);o.frequency.exponentialRampToValueAtTime(f1,n+t0+d);v.gain.setValueAtTime(vol,n+t0);v.gain.exponentialRampToValueAtTime(.001,n+t0+d);o.connect(v);v.connect(out);o.start(n+t0);o.stop(n+t0+d+.05)};
 if(k=='boom')osc('sine',140,28,0,.9,1.4);
 else if(k=='horn')[0,.18,.36].forEach(s=>{osc('sawtooth',466,440,s,.16);osc('sawtooth',587,554,s,.16,.7)});
 else if(k=='sad')[[311,0,.42],[294,.45,.42],[277,.9,.42],[262,1.35,.9]].forEach(([f,s,d],i)=>osc('sawtooth',f,f*(i==3?.8:.99),s,d,.8));
 else if(k=='ding'){osc('sine',1319,1319,0,.8);osc('sine',1976,1976,0,.6,.4)}
 else if(k=='bruh')osc('sawtooth',160,90,0,.5,.9);
}
let lastSnd=0;
function play(k){if(Date.now()-lastSnd<700)return;lastSnd=Date.now();sfx(k);bcast({t:'snd',k})}

/* vibes: everyone sees your look (each person applies the filter to your tile) */
const FX={bw:'grayscale(1) contrast(1.1)',retro:'sepia(.8) saturate(1.4) hue-rotate(-15deg)',neon:'saturate(2.5) contrast(1.2) hue-rotate(290deg)',dream:'blur(1.2px) brightness(1.15) saturate(1.4)',invert:'invert(1) hue-rotate(180deg)'},FXK=Object.keys(FX);
function setFx(k){me.fx=FXK.includes(k)?k:'';tile('me');bcast(stMsg());g('fv').querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.fx=='none'?'':b.dataset.fx)==me.fx))}

/* party */
const PQ={truth:["What is your most used emoji and why?","What did you last search on your phone?","What is a harmless secret talent you have?","What is the most embarrassing song on your playlist?","Who would you swap lives with for a day?","What is your biggest irrational fear?"],
 dare:["Do your best impression of someone on this call","Talk in an accent until your next turn","Show the weirdest thing within arm's reach","Make the funniest face you can for 5 seconds","Sing the chorus of the last song you heard","Say a sentence without the letter E"],
 wyr:["Would you rather always be 10 minutes late or 20 minutes early?","Would you rather lose your phone or your wallet for a week?","Would you rather have unlimited pizza or unlimited tacos?","Would you rather fly or be invisible?","Would you rather never use emoji or never use GIFs again?","Would you rather rewatch one show forever or never watch TV again?"]};
const rnd=a=>a[Math.random()*a.length|0];
let bt;
function banner(m,by){const b=g('bn');b.textContent=(by?by+': ':'')+m;b.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('on'),7000)}
function party(k){
 let m;
 if(k=='truth')m='🫣 Truth: '+rnd(PQ.truth);else if(k=='dare')m='😈 Dare: '+rnd(PQ.dare);else if(k=='wyr')m='🤔 '+rnd(PQ.wyr);
 else if(k=='pick')m='🎯 picked '+rnd([me.name,...Object.keys(peers).filter(i=>peers[i].c&&peers[i].c.open).map(i=>peers[i].name||'Guest')]);
 else if(k=='coin')m='🪙 flipped '+(Math.random()<.5?'Heads':'Tails');
 else m='🎲 rolled a '+(1+Math.random()*6|0);
 bcast({t:'say',m});banner(m,me.name);
}
SND.forEach(x=>{const b=document.createElement('button');b.dataset.sn=x[0];b.textContent=x[1];g('fs').append(b)});
[['none','✨ None'],['bw','🎞️ B&W'],['retro','📼 Retro'],['neon','🌈 Neon'],['dream','☁️ Dream'],['invert','🙃 Weird']].forEach(x=>{const b=document.createElement('button');b.dataset.fx=x[0];b.textContent=x[1];g('fv').append(b)});
[['truth','🫣 Truth'],['dare','😈 Dare'],['wyr','🤔 Would you rather'],['pick','🎯 Pick someone'],['coin','🪙 Coin'],['dice','🎲 Dice']].forEach(x=>{const b=document.createElement('button');b.dataset.pt=x[0];b.textContent=x[1];g('fq').append(b)});

try{g('uname').value=localStorage.getItem('peace-name')||''}catch(e){}
try{const n=sessionStorage.getItem('peace-note');if(n){g('err').textContent=n;sessionStorage.removeItem('peace-note')}}catch(e){}
g('pav').textContent=ini(g('uname').value);
try{g('mt').checked=localStorage.getItem('peace-memes')!='0'}catch(e){}
if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)document.querySelector('[data-a=share]').hidden=false;
if(location.hash.length>1){g('jc').value=norm(location.hash);g('jc').focus()}
if(g('mt').checked)loadFace().catch(()=>{});
setTimeout(()=>{setSplash(false);getMedia()},2300);
